name: rsi-run

# The framework confines every work unit in a systemd user cgroup and refuses to
# start without one ("resource governance is load-bearing"). This box has tini as
# PID 1, so `aibuildai run` cannot execute here at all; a hosted runner is a real
# systemd VM, so the loop runs there.

on:
  # Push trigger so the run can be started from the repo itself (bump the
  # marker file). workflow_dispatch stays for manual runs with custom budgets.
  push:
    paths:
      - .github/rsi-trigger
  workflow_dispatch:
    inputs:
      wall_clock_minutes:
        description: hard stop for the whole run
        default: "300"
      cost_usd:
        description: total spend cap
        default: "80"
      worker_minutes:
        description: wall clock per work unit
        default: "35"
      per_agent_cost_cap_usd:
        description: spend cap per agent
        default: "20"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      AIBUILDAI_SKIP_SUBSCRIPTION_CHECK: "1"
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_SMALL_FAST_MODEL: spark-x2.6
      SHERPA_MODEL_DIR: ${{ github.workspace }}/.models/sherpa-onnx-nemo-fast-conformer-ctc-be-de-en-es-fr-hr-it-pl-ru-uk-20k-int8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Secrets pasted from a phone often carry a trailing newline, and systemd
      # refuses any env value that contains one.
      - name: Sanitize secrets
        run: |
          printf 'ANTHROPIC_BASE_URL=%s\n' "$(printf '%s' "$ANTHROPIC_BASE_URL" | tr -d '\r\n' | xargs)" >> "$GITHUB_ENV"
          printf 'ANTHROPIC_AUTH_TOKEN=%s\n' "$(printf '%s' "$ANTHROPIC_AUTH_TOKEN" | tr -d '\r\n' | xargs)" >> "$GITHUB_ENV"
          echo "base_url bytes: $(printf '%s' "$ANTHROPIC_BASE_URL" | wc -c)"

      - name: Framework + runtime
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install -q --upgrade pip
          cp -r framework /tmp/framework
          cd /tmp/framework
          export AIBUILDAI_CLIPROXYAPI_SOURCE_COMMIT=$(python -c "import json;print(json.load(open('packages/conversation/src/aibuildai_conversation/_native/identity.json'))['commit'])")
          pip install -q -e ./packages/execution -e ./packages/conversation -e .
          cd "$GITHUB_WORKSPACE"
          pip install -q sherpa-onnx soundfile numpy pyyaml
          npm install -g @anthropic-ai/claude-code
          # Steps do not share a shell, so put the venv on the job PATH.
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> "$GITHUB_ENV"
          aibuildai --version

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex libreadline-dev uuid-dev libossp-uuid-dev zlib1g-dev

      - name: Owned tools (PostgreSQL 18.6)
        run: |
          aibuildai setup
          ~/.aibuildai/tools/postgresql/18.6/bin/postgres --version

      - name: Model
        run: |
          mkdir -p "$(dirname "$SHERPA_MODEL_DIR")"
          if [ ! -f "$SHERPA_MODEL_DIR/model.int8.onnx" ]; then
            curl -sSL -o /tmp/m.tar.bz2 \
              "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemo-fast-conformer-ctc-be-de-en-es-fr-hr-it-pl-ru-uk-20k-int8.tar.bz2"
            tar -xjf /tmp/m.tar.bz2 -C "$(dirname "$SHERPA_MODEL_DIR")"
          fi
          ls -lh "$SHERPA_MODEL_DIR"

      - name: Corpus and manifests
        run: |
          . .venv/bin/activate
          if [ ! -d /tmp/corpus/LibriSpeech ]; then
            curl -sSL -o /tmp/dc.tar.gz https://www.openslr.org/resources/12/dev-clean.tar.gz
            mkdir -p /tmp/corpus && tar -xzf /tmp/dc.tar.gz -C /tmp/corpus
          fi
          python data/prepare_librispeech.py /tmp/corpus/LibriSpeech/dev-clean /tmp/corpus/wav \
            --limit-chapters 6 --max-utts 260
          python data/make_manifest.py /tmp/corpus/wav --out data/dev_manifest.jsonl --split dev --lang en
          python data/make_manifest.py /tmp/corpus/wav --out data/hidden_manifest.jsonl --split hidden --lang en
          wc -l data/dev_manifest.jsonl data/hidden_manifest.jsonl

      - name: Render config
        run: |
          sed -e "s|__REPO__|$GITHUB_WORKSPACE|g" -e "s|__PLAYGROUND__|$GITHUB_WORKSPACE/playground|g" \
            search/run_config.yaml > /tmp/run.yaml
          sed -i \
            -e "s|wall_clock_minutes: 180|wall_clock_minutes: ${{ inputs.wall_clock_minutes || '300' }}|" \
            -e "s|cost_usd: 30|cost_usd: ${{ inputs.cost_usd || '80' }}|" \
            -e "s|per_agent_cost_cap_usd: 8|per_agent_cost_cap_usd: ${{ inputs.per_agent_cost_cap_usd || '20' }}|" \
            -e "s|minutes: 25|minutes: ${{ inputs.worker_minutes || '35' }}|" /tmp/run.yaml
          grep -E "wall_clock|cost_usd|playground_root|data_root" /tmp/run.yaml

      # The runner is systemd PID 1, but the runner account has no user manager
      # until linger is enabled - and the framework refuses to start without one.
      - name: systemd user manager
        run: |
          UID_=$(id -u)
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${UID_}.service"
          export XDG_RUNTIME_DIR="/run/user/${UID_}"
          echo "XDG_RUNTIME_DIR=/run/user/${UID_}" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do
            systemctl --user is-system-running 2>/dev/null | grep -qE "running|degraded" && break
            sleep 1
          done
          echo "uid=${UID_} runtime=${XDG_RUNTIME_DIR} linger=$(loginctl show-user "$USER" -p Linger)"
          systemctl --user is-system-running

      - name: Run
        # tee reports its own status, so without pipefail a failed run shows up
        # as a green step -- that is how the setup_1 assertion in run #6 slipped
        # past and had to be found by reading the log.
        run: |
          set -o pipefail
          . .venv/bin/activate
          aibuildai run /tmp/run.yaml 2>&1 | tee /tmp/run.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsi-run
          # Deliberately NOT run.log: GitHub masks secret values in the job log,
          # but it does not scrub uploaded files. /tmp/run.log is already echoed
          # to the job log by tee, so uploading it again only adds an unmasked
          # copy of anything an agent might have printed.
          path: |
            playground/**/workspace/**
            playground/**/resource_samples.jsonl
            data/*_manifest.jsonl
          retention-days: 30
